name: Steam daily research
on:
  schedule:
    - cron: '13 1 * * *'
  workflow_dispatch:
concurrency:
  group: steam-dataset
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/steam -p 'test_*.py'
      - name: Restore bounded last successful dataset
        run: |
          mkdir -p work
          git fetch --depth=1 origin snapshot
          git show FETCH_HEAD:payload/latest.json.gz | gzip -dc > work/latest.json
          git show FETCH_HEAD:payload/history.sqlite.gz | gzip -dc > work/history.sqlite
      - name: Verify public Steam access from the runner
        run: python scripts/steam/probe.py
      - name: Collect fresh data
        run: python scripts/steam/collect.py --directory work
      - name: Package bounded payloads
        run: python scripts/steam/publish_branch.py --directory work --package-only
      - name: Preserve and verify source responses
        run: |
          tar -czf work/raw.tar.gz -C work raw
          python scripts/steam/check_archive.py --directory work --archive work/raw.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-research-${{ github.run_id }}
          path: |
            payload/*.gz
            payload/manifest.json
            work/raw.tar.gz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Publish verified dataset after archiving succeeds
        run: python scripts/steam/publish_branch.py --directory work --prepared
      - name: Deliver the same verified snapshot through the existing HTTPS tunnel
        env:
          STEAM_PUBLISH_TOKEN: ${{ secrets.STEAM_PUBLISH_TOKEN }}
        run: python scripts/steam/push_site.py
