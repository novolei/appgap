name: Weekly ingest

on:
  schedule:
    # 90 minutes after the Worker cron (00:30 UTC), in case Apple blocked Cloudflare IPs.
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull App Store charts into production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPGAP_INGEST_LOG: ingest.log
        run: bash scripts/ingest-to-prod.sh
      - name: Ingest log
        if: always()
        run: tail -n 80 ingest.log || true
